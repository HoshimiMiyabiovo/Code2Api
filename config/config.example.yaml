# Code2Api 本地网关配置
# 复制本文件为 config/config.yaml 后按需修改。
# 密钥可通过 key_env 引用环境变量，避免明文入库。

server:
  host: 127.0.0.1          # 只监听回环地址
  port: 8787
  body_limit_mb: 50
  client_keys: []          # 非空时，/v1/* 需要 Bearer 或 x-api-key 匹配其中之一
  max_concurrency: 32      # 同时在跑的生成请求上限（0=不限）
  max_queue_wait_ms: 120000 # 并发排队超时，超时返回 503

admin:
  token: ""                # 留空则每次启动生成临时口令并打印到控制台

storage:
  path: ./data/gateway.db  # 相对路径按启动目录解析；数据永久保留，不自动删除

routing:
  max_attempts: 6          # 单个请求最多尝试的 渠道×密钥 次数
  model_aliases:           # 对外模型别名；支持 * 通配与 $1 捕获
    # fast: gpt-4o-mini
    # "team/*": "gpt-4o-$1"
  model_blacklist: []      # 黑名单，支持通配，如 "*-image*"
  cooldowns:
    auth_ms: 600000        # 401/403：密钥失效冷却 10 分钟
    rate_limit_ms: 60000   # 429 基础冷却，连续失败指数递增
    payment_ms: 1800000    # 402 余额/额度耗尽冷却 30 分钟
    server_ms: 15000       # 5xx 冷却
    network_ms: 10000      # 网络错误/超时冷却
    empty_stream_ms: 5000  # 上游 200 但无首包
    max_ms: 1800000        # 冷却上限

anthropic:
  emit_thinking: false     # Anthropic 客户端是否接收 reasoning 块（无签名，默认关闭）

catalog:
  sync_enabled: true       # 从上游 /models 同步模型目录
  sync_on_start: true      # 启动时立即同步一次（失败不影响启动）
  sync_interval_ms: 3600000 # 定时同步间隔（默认 1 小时）
  reasoning_hints: true    # 按模型名推断 reasoning 能力（可被手工配置覆盖）

health:
  enabled: true            # 主动探活（HTTP 渠道探测 /models）
  interval_ms: 300000      # 探活间隔
  timeout_ms: 10000        # 单次探活超时

providers:
  # 内置 mock 渠道：无需密钥，用于首跑自测；正式使用可置 enabled: false
  - id: mock
    type: mock
    priority: 1000
    models:
      - id: mock-chat
        context_window: 32768
        max_output_tokens: 4096
        capabilities:
          tools: true
          vision: false
          reasoning: true
        pricing:
          input_per_mtok: 0
          output_per_mtok: 0

  # API key 型渠道示例（去掉注释并填写）
  # - id: station-a
  #   type: openai-compatible
  #   priority: 10
  #   base_url: https://api.example.com/v1   # 建议以 /v1 结尾
